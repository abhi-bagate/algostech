<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Algostech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--primary:#00ffcc;--primary-dim:rgba(0,255,204,0.10);--red:#ff5a5a;--red-dim:rgba(255,90,90,0.12);--red-border:rgba(255,90,90,0.30);--bg:#050914;--bg-card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--text:#e8edf8;--text-muted:#6b7a99;--font:'Inter',sans-serif;--radius:16px;--radius-sm:10px;--radius-pill:999px;--ease:cubic-bezier(0.4,0,0.2,1);}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;}
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.05) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 80%);pointer-events:none;}
    .bg-orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;}
    .orb1{width:420px;height:420px;background:radial-gradient(circle,rgba(255,90,90,0.07),transparent 70%);top:-180px;right:-120px;}
    .orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(0,194,255,0.05),transparent 70%);bottom:-80px;left:-80px;}
    .noise{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}

    .wrap{position:relative;z-index:10;width:100%;max-width:400px;}

    /* Logo */
    .logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px;font-size:1.3rem;font-weight:700;letter-spacing:-0.01em;}
    .logo img{width:42px;height:42px;object-fit:contain;flex-shrink:0;display:block;}
    .logo img[src=""],.logo img:not([src]){display:none;}
    .logo-text{color:var(--text);}
    .admin-tag{font-size:0.58rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;background:var(--red-dim);border:1px solid var(--red-border);color:var(--red);padding:3px 10px;border-radius:var(--radius-pill);}

    /* Card */
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:38px 34px;position:relative;overflow:hidden;backdrop-filter:blur(12px);}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);opacity:0.7;}
    .card-title{font-size:1.35rem;font-weight:700;margin-bottom:6px;letter-spacing:-0.02em;}
    .card-sub{font-size:0.83rem;color:var(--text-muted);margin-bottom:28px;line-height:1.5;}

    /* Field */
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:20px;}
    label{font-size:0.6rem;letter-spacing:0.14em;color:var(--red);text-transform:uppercase;font-weight:600;}
    input{width:100%;background:rgba(255,255,255,0.035);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:12px 16px;font-size:0.92rem;font-family:var(--font);outline:none;transition:0.25s var(--ease);}
    input::placeholder{color:var(--text-muted);}
    input:focus{border-color:var(--red-border);background:rgba(255,90,90,0.04);box-shadow:0 0 0 3px rgba(255,90,90,0.08);}

    /* Button */
    .btn{width:100%;background:var(--red);color:#fff;border:none;padding:14px;border-radius:var(--radius-pill);font-size:0.95rem;font-weight:700;font-family:var(--font);cursor:pointer;transition:0.3s var(--ease);box-shadow:0 0 24px rgba(255,90,90,0.25);}
    .btn:hover{background:#ff7777;transform:translateY(-2px);box-shadow:0 0 36px rgba(255,90,90,0.4);}

    /* Error */
    .error-msg{display:none;margin-top:14px;background:var(--red-dim);border:1px solid var(--red-border);border-radius:var(--radius-sm);padding:11px 16px;color:var(--red);font-size:0.78rem;text-align:center;}

    /* Back */
    .back{text-align:center;margin-top:22px;font-size:0.72rem;color:var(--text-muted);}
    .back a{color:var(--text-muted);text-decoration:none;transition:0.2s;}
    .back a:hover{color:var(--primary);}
    .back span{opacity:0.4;margin:0 8px;}
  </style>
</head>
<body>
<div class="noise"></div>
<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="wrap">

  <div class="logo">
    <img src="Images/logo.png" alt="Algostech" onerror="this.style.display='none'"/>
    <span class="logo-text">Algostech</span>
    <span class="admin-tag">ADMIN</span>
  </div>

  <div class="card">
    <div class="card-title">Admin Login</div>
    <div class="card-sub">Restricted area — authorised personnel only.</div>

    <div class="field">
      <label>Admin Password</label>
      <input type="password" id="adminPass" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') doLogin()"
             autocomplete="current-password"/>
    </div>

    <button class="btn" onclick="doLogin()">Login to Admin Panel →</button>

    <div class="error-msg" id="errMsg">Incorrect password. Please try again.</div>
  </div>

  <div class="back">
    <a href="auth.html">← Client Login</a>
    <span>·</span>
    <a href="index.html">Back to Site</a>
  </div>

</div>

<script>
function doLogin() {
  const pass   = document.getElementById('adminPass').value;
  const stored = localStorage.getItem('algo_admin_pass') || 'Admin@1234';
  if (pass === stored) {
    sessionStorage.setItem('algo_admin_auth', '1');
    window.location.href = 'admin.html';
  } else {
    const err = document.getElementById('errMsg');
    err.style.display = 'block';
    document.getElementById('adminPass').value = '';
    document.getElementById('adminPass').focus();
    setTimeout(() => err.style.display = 'none', 3500);
  }
}
// Already authenticated this session
if (sessionStorage.getItem('algo_admin_auth') === '1') {
  window.location.href = 'admin.html';
}
</script>
</body>
</html>
