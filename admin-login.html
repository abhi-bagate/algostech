<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Algostech</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--primary:#00ffcc;--primary-dim:rgba(0,255,204,0.1);--primary-glow:rgba(0,255,204,0.3);--red:#ff5a5a;--bg:#050914;--bg-card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--border-bright:rgba(0,255,204,0.28);--text:#e8edf8;--text-muted:#6b7a99;--font:'Inter',sans-serif;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.04) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 80%);pointer-events:none;}
    .orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;}
    .orb1{width:400px;height:400px;background:radial-gradient(circle,rgba(0,255,204,0.07),transparent 70%);top:-150px;right:-100px;}
    .orb2{width:300px;height:300px;background:radial-gradient(circle,rgba(0,194,255,0.05),transparent 70%);bottom:-100px;left:-80px;}

    .wrap{position:relative;z-index:10;width:100%;max-width:400px;padding:20px;}
    .logo{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.3rem;font-weight:700;margin-bottom:28px;}
    .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
    .admin-tag{font-size:0.6rem;background:rgba(255,90,90,0.15);border:1px solid rgba(255,90,90,0.3);color:var(--red);padding:2px 8px;border-radius:999px;letter-spacing:0.1em;}

    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:36px 32px;position:relative;overflow:hidden;}
    .card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--red),transparent);}

    .title{font-size:1.3rem;font-weight:700;margin-bottom:4px;}
    .sub{color:var(--text-muted);font-size:0.82rem;margin-bottom:28px;}

    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
    label{font-size:0.6rem;letter-spacing:0.12em;color:rgba(255,90,90,0.8);text-transform:uppercase;font-weight:600;}
    input{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 14px;font-size:0.88rem;font-family:var(--font);outline:none;transition:0.2s;}
    input::placeholder{color:var(--text-muted);}
    input:focus{border-color:rgba(255,90,90,0.4);box-shadow:0 0 0 3px rgba(255,90,90,0.07);}

    .btn{width:100%;background:var(--red);color:#fff;border:none;padding:13px;border-radius:999px;font-size:0.92rem;font-weight:600;font-family:var(--font);cursor:pointer;transition:0.25s;margin-top:8px;box-shadow:0 0 20px rgba(255,90,90,0.2);}
    .btn:hover{background:#ff7777;transform:translateY(-1px);}

    .error-msg{display:none;margin-top:14px;background:rgba(255,90,90,0.08);border:1px solid rgba(255,90,90,0.25);border-radius:8px;padding:11px 14px;color:var(--red);font-size:0.78rem;text-align:center;}

    .back{text-align:center;margin-top:18px;font-size:0.75rem;color:var(--text-muted);}
    .back a{color:var(--text-muted);transition:0.2s;}
    .back a:hover{color:var(--primary);}

    .demo-hint{margin-top:14px;text-align:center;font-size:0.72rem;color:var(--text-muted);background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:10px;}
    .demo-hint strong{color:var(--text);}
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
  <div class="logo">
    <div class="logo-dot"></div>
    Algostech
    <span class="admin-tag">ADMIN</span>
  </div>

  <div class="card">
    <div class="title">Admin Login</div>
    <div class="sub">Restricted area — authorised personnel only.</div>

    <div class="field"><label>Admin Password</label><input type="password" id="adminPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <button class="btn" onclick="doLogin()">Login to Admin Panel</button>
    <div class="error-msg" id="errMsg">Incorrect password. Please try again.</div>

    <div class="demo-hint">Default password: <strong>Admin@1234</strong><br/>Change it in Settings after login.</div>
  </div>

  <div class="back"><a href="index.html">← Back to Algostech</a></div>
</div>

<script>
function doLogin() {
  const pass = document.getElementById('adminPass').value;
  const stored = localStorage.getItem('algo_admin_pass') || 'Admin@1234';
  if (pass === stored) {
    sessionStorage.setItem('algo_admin_auth','1');
    window.location.href = 'admin.html';
  } else {
    document.getElementById('errMsg').style.display='block';
    setTimeout(()=>document.getElementById('errMsg').style.display='none',3000);
  }
}
// Already logged in?
if (sessionStorage.getItem('algo_admin_auth')==='1') window.location.href='admin.html';
</script>
</body>
</html>
