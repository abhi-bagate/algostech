<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algostech</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAVBAR -->
<nav>
  <h2 class="logo">
    <img src="Images/logo.png" class="logo-img">
    Algostech
  </h2>

  <ul id="navLinks">
    <li onclick="scrollToSection('hero')">Home</li>
    <li onclick="scrollToSection('services')">Services</li>
    <li onclick="scrollToSection('about')">About</li>
    <li onclick="scrollToSection('payment')">Payment</li>
    <li><button class="nav-btn">Login</button></li>
  </ul>

  <div class="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-left">
    <h1>AI Powered <span>Forex Trading</span></h1>
    <p>Trade smarter with automation & AI strategies.</p>

    <div class="hero-buttons">
      <button class="btn primary">Get Started</button>
      <button class="btn secondary">Learn More</button>
    </div>
  </div>

  <div class="hero-right">
    <img src="Images/robot2.png" class="robot-img">
  </div>
</section>

<!-- SERVICES -->
<section class="services" id="services">
  <h2>Our Services</h2>

  <div class="cards">
    <div class="card">Algo Trading</div>
    <div class="card">AI Signals</div>
    <div class="card">Commodities</div>
    <div class="card">Risk Management</div>
  </div>
</section>

<!-- PAYMENT -->
<section class="payment-home" id="payment">
  <h1>Make a Crypto Payment</h1>

  <div class="payment-box">
    <input type="number" id="amount" placeholder="Enter Amount">
    <button onclick="goToPayment()">Pay</button>
  </div>
</section>

<footer>
  <p>© 2026 Algostech</p>
</footer>

<script>
function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({ behavior: "smooth" });
}

function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("active");
}

function goToPayment() {
  const amount = document.getElementById("amount").value;

  if (!amount || amount <= 0) {
    alert("Enter valid amount");
    return;
  }

  window.location.href = `Payment.html?amount=${amount}`;
}
</script>

</body>
</html>
