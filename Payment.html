<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>
<link rel="stylesheet" href="payment.css">
</head>

<body>

<!-- NAV -->
<nav>
  <h2>Algostech</h2>
  <ul>
    <li onclick="showInput()">Payment</li>
  </ul>
  
  <div class="hamburger" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>
</nav>
<div class="hamburger" onclick="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</div>
<!-- ================= STEP 1 (IMAGE 1) ================= -->
<section class="payment-input" id="inputSection">

  <h1>Make a Crypto Payment</h1>
  <p>Secure payment via USDT or Crypto Wallet</p>

  <div class="payment-box">
    <input type="number" id="amount" placeholder="Enter Amount (USD)">
    <button onclick="showQR()">Pay with Crypto</button>
  </div>

</section>


<!-- ================= STEP 2 (IMAGE 2) ================= -->
<section class="payment-qr hidden" id="qrSection">

  <h1>Crypto Payment</h1>
  <h2 id="amountText">Pay $0 in USDT</h2>

  <div class="wallet-box">
    <h3>USDT - ERC20</h3>
    <img src="Images/qr1.png" class="qr">
    <p class="wallet">0x4be19a1a2ecb95cf7561815a0bdc3bc943c1712b</p>
    <button onclick="copyAddress()">Copy Wallet Address</button>
  </div>

  <div class="wallet-box">
    <h3>USDT - BEP20</h3>
    <img src="Images/qr2.png" class="qr">
    <p class="wallet">0xYourBEP20Address</p>
  </div>

</section>

<script>

// SHOW QR SECTION
function showQR() {
  const amount = document.getElementById("amount").value;

  if (!amount || amount <= 0) {
    alert("Enter valid amount");
    return;
  }

  document.getElementById("amountText").innerText = `Pay $${amount} in USDT`;

  document.getElementById("inputSection").classList.add("hidden");
  document.getElementById("qrSection").classList.remove("hidden");
}

// NAV CLICK → BACK TO INPUT
function showInput() {
  document.getElementById("qrSection").classList.add("hidden");
  document.getElementById("inputSection").classList.remove("hidden");
}

// COPY FUNCTION
function copyAddress() {
  const address = document.querySelector(".wallet").innerText;
  navigator.clipboard.writeText(address);
  alert("Copied!");
}

</script>

</body>
</html>
