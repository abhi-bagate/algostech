<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>
<link rel="stylesheet" href="payment.css">
</head>

<body>

<!-- NAV -->
<nav>
  <h2>Algostech</h2>
  <button onclick="goBack()">← Back</button>
</nav>

<!-- STEP 1 -->
<section class="payment-input" id="inputSection">
  <h1>Make a Crypto Payment</h1>
  <p>Secure payment via USDT</p>

  <div class="payment-box">
    <input type="number" id="amount" placeholder="Enter Amount (USD)">
    <button onclick="showQR()">Continue</button>
  </div>
</section>

<!-- STEP 2 -->
<section class="payment-qr hidden" id="qrSection">
  <h1>Complete Payment</h1>
  <h2 id="amountText"></h2>

  <div class="wallet-box">
    <h3>USDT - ERC20</h3>
    <img src="Images/qr1.png" class="qr">
    <p id="walletAddress">0x4be19a1a2ecb95cf7561815a0bdc3bc943c1712b</p>
    <button onclick="copyAddress()">Copy Address</button>
  </div>

  <button class="back-btn" onclick="goBackToInput()">Change Amount</button>
</section>

<script>

// AUTO-FILL AMOUNT FROM URL
const params = new URLSearchParams(window.location.search);
const urlAmount = params.get("amount");

if (urlAmount) {
  document.getElementById("amount").value = urlAmount;
}

// SHOW QR
function showQR() {
  const amount = document.getElementById("amount").value;

  if (!amount || amount <= 0) {
    alert("Enter valid amount");
    return;
  }

  document.getElementById("amountText").innerText = `Pay $${amount} in USDT`;

  document.getElementById("inputSection").classList.add("hidden");
  document.getElementById("qrSection").classList.remove("hidden");
}

// BACK TO INPUT
function goBackToInput() {
  document.getElementById("qrSection").classList.add("hidden");
  document.getElementById("inputSection").classList.remove("hidden");
}

// COPY
function copyAddress() {
  const address = document.getElementById("walletAddress").innerText;
  navigator.clipboard.writeText(address);
  alert("Copied!");
}

// BACK TO HOME
function goBack() {
  window.history.back();
}

</script>

</body>
</html>
