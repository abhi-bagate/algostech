<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Algostech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--primary:#00ffcc;--primary-dim:rgba(0,255,204,0.1);--primary-glow:rgba(0,255,204,0.35);--accent:#00c2ff;--bg:#050914;--bg-card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--border-bright:rgba(0,255,204,0.28);--text:#e8edf8;--text-muted:#6b7a99;--red:#ff5a5a;--font-display:'Syne',sans-serif;--font-mono:'Space Mono',monospace;--font-body:'DM Sans',sans-serif;--radius:16px;--radius-sm:10px;--radius-pill:999px;--ease:cubic-bezier(0.4,0,0.2,1);}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .bg-grid{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 80%);pointer-events:none;}
    .bg-orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;}
    .orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(0,255,204,0.07),transparent 70%);top:-200px;right:-150px;}
    .orb2{width:350px;height:350px;background:radial-gradient(circle,rgba(0,194,255,0.06),transparent 70%);bottom:-100px;left:-100px;}
    .noise{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px;}
    .auth-wrap{position:relative;z-index:10;width:100%;max-width:460px;padding:20px;}
    .auth-logo{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-size:1.4rem;font-weight:800;margin-bottom:32px;filter:drop-shadow(0 0 8px var(--primary-glow));}
    .auth-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 36px;position:relative;overflow:hidden;}
    .auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent);}
    .auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-bottom:32px;}
    .tab-btn{padding:10px;border:none;background:transparent;color:var(--text-muted);font-family:var(--font-mono);font-size:0.78rem;letter-spacing:0.08em;border-radius:8px;transition:0.25s var(--ease);cursor:pointer;}
    .tab-btn.active{background:var(--primary-dim);border:1px solid var(--border-bright);color:var(--primary);}
    .auth-form{display:none;}
    .auth-form.active{display:block;}
    .form-title{font-family:var(--font-display);font-size:1.5rem;font-weight:800;margin-bottom:6px;}
    .form-sub{color:var(--text-muted);font-size:0.85rem;margin-bottom:28px;}
    .field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px;}
    label{font-family:var(--font-mono);font-size:0.62rem;letter-spacing:0.14em;color:var(--primary);text-transform:uppercase;}
    input,select{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);padding:12px 16px;font-size:0.92rem;font-family:var(--font-body);outline:none;transition:0.25s var(--ease);}
    input::placeholder{color:var(--text-muted);}
    input:focus,select:focus{border-color:var(--border-bright);background:rgba(0,255,204,0.03);box-shadow:0 0 0 3px rgba(0,255,204,0.07);}
    select option{background:#0a0f20;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .btn-primary{width:100%;background:var(--primary);color:#000;border:none;padding:14px;border-radius:var(--radius-pill);font-size:0.95rem;font-weight:700;font-family:var(--font-body);cursor:pointer;transition:0.3s var(--ease);box-shadow:0 0 20px rgba(0,255,204,0.22);margin-top:8px;}
    .btn-primary:hover{background:#fff;transform:translateY(-2px);}
    .switch-text{text-align:center;margin-top:18px;font-size:0.82rem;color:var(--text-muted);}
    .switch-text a{color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
    .msg-box{border-radius:var(--radius-sm);padding:12px 16px;font-size:0.78rem;font-family:var(--font-mono);margin-top:12px;text-align:center;display:none;}
    .msg-box.error{background:rgba(255,90,90,0.08);border:1px solid rgba(255,90,90,0.25);color:var(--red);}
    .msg-box.success{background:var(--primary-dim);border:1px solid var(--border-bright);color:var(--primary);}
    .back-link{text-align:center;margin-top:20px;font-family:var(--font-mono);font-size:0.72rem;color:var(--text-muted);}
    .back-link a{color:var(--text-muted);transition:0.2s;text-decoration:none;}
    .back-link a:hover{color:var(--primary);}
    @media(max-width:480px){.auth-card{padding:28px 20px;}.form-row{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div class="noise"></div>
<div class="bg-grid"></div>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="auth-wrap">
  <div class="auth-logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <polygon points="14,2 26,8 26,20 14,26 2,20 2,8" fill="none" stroke="#00ffcc" stroke-width="1.5"/>
      <polygon points="14,7 21,11 21,17 14,21 7,17 7,11" fill="#00ffcc" opacity="0.15"/>
      <circle cx="14" cy="14" r="3" fill="#00ffcc"/>
    </svg>
    Algostech
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">LOGIN</button>
      <button class="tab-btn" id="registerTab" onclick="switchTab('register')">REGISTER</button>
    </div>

    <!-- LOGIN -->
    <div class="auth-form active" id="loginForm">
      <div class="form-title">Welcome Back</div>
      <div class="form-sub">Login to access your trading dashboard.</div>
      <div class="field"><label>Email Address</label><input type="email" id="loginEmail" placeholder="you@example.com" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <div class="field"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn-primary" onclick="doLogin()">Login to Dashboard →</button>
      <div class="msg-box error" id="loginError"></div>
      <div class="switch-text">Don't have an account? <a onclick="switchTab('register')">Register here</a></div>
    </div>

    <!-- REGISTER -->
    <div class="auth-form" id="registerForm">
      <div class="form-title">Create Account</div>
      <div class="form-sub">Submit your details — admin will activate your account.</div>
      <div class="form-row">
        <div class="field"><label>First Name</label><input type="text" id="regFirst" placeholder="Ravi"/></div>
        <div class="field"><label>Last Name</label><input type="text" id="regLast" placeholder="Sharma"/></div>
      </div>
      <div class="field"><label>Email Address</label><input type="email" id="regEmail" placeholder="you@example.com"/></div>
      <div class="field"><label>Mobile Number</label><input type="tel" id="regMobile" placeholder="+91 00000 00000"/></div>
      <div class="field"><label>Service Plan</label>
        <select id="regPlan">
          <option value="Alpha">Alpha — $250/month</option>
          <option value="Quantum">Quantum — $500/month</option>
          <option value="Infinity">Infinity — $1,000/month</option>
        </select>
      </div>
      <div class="field"><label>Password</label><input type="password" id="regPass" placeholder="Min 6 characters"/></div>
      <button class="btn-primary" onclick="doRegister()">Submit Registration →</button>
      <div class="msg-box error" id="regError"></div>
      <div class="msg-box success" id="regSuccess">✅ Registered! Login once admin activates your account.</div>
      <div class="switch-text">Already have an account? <a onclick="switchTab('login')">Login here</a></div>
    </div>
  </div>

  <div class="back-link">
    <a href="index.html">← Back to Algostech</a> &nbsp;·&nbsp;
    <a href="admin-login.html">Admin Panel</a>
  </div>
</div>

<script>
function switchTab(t){
  ['login','register'].forEach(s=>{
    document.getElementById(s+'Tab').classList.toggle('active',s===t);
    document.getElementById(s+'Form').classList.toggle('active',s===t);
  });
}
function showMsg(id,msg,type){
  const el=document.getElementById(id);
  el.textContent=msg; el.className='msg-box '+type; el.style.display='block';
  setTimeout(()=>el.style.display='none',4000);
}
function doLogin(){
  const email=document.getElementById('loginEmail').value.trim().toLowerCase();
  const pass=document.getElementById('loginPass').value;
  if(!email||!pass){showMsg('loginError','Enter your email and password.','error');return;}
  const users=JSON.parse(localStorage.getItem('algo_users')||'[]');
  const user=users.find(u=>u.email===email&&u.pass===pass);
  if(!user){showMsg('loginError','Invalid email or password.','error');return;}
  if(user.status==='inactive'){showMsg('loginError','Account inactive. Contact support.','error');return;}
  if(user.status==='pending'){showMsg('loginError','Account pending admin activation.','error');return;}
  localStorage.setItem('algo_logged_user',JSON.stringify(user));
  window.location.href='dashboard.html';
}
function doRegister(){
  const first=document.getElementById('regFirst').value.trim();
  const last=document.getElementById('regLast').value.trim();
  const email=document.getElementById('regEmail').value.trim().toLowerCase();
  const mobile=document.getElementById('regMobile').value.trim();
  const plan=document.getElementById('regPlan').value;
  const pass=document.getElementById('regPass').value;
  if(!first||!last||!email||!pass){showMsg('regError','Please fill all required fields.','error');return;}
  if(pass.length<6){showMsg('regError','Password must be at least 6 characters.','error');return;}
  const users=JSON.parse(localStorage.getItem('algo_users')||'[]');
  if(users.find(u=>u.email===email)){showMsg('regError','Email already registered.','error');return;}
  users.push({id:Date.now().toString(),name:first+' '+last,email,pass,mobile,plan,city:'',dob:'',mt5:'',server:'',kyc:'Pending',capital:0,status:'pending',createdAt:new Date().toISOString()});
  localStorage.setItem('algo_users',JSON.stringify(users));
  document.getElementById('regSuccess').style.display='block';
  setTimeout(()=>switchTab('login'),3000);
}
const p=new URLSearchParams(window.location.search);
if(p.get('tab')==='register')switchTab('register');
if(localStorage.getItem('algo_logged_user'))window.location.href='dashboard.html';
</script>
</body>
</html>
